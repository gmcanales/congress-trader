services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-congress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-congress}
      POSTGRES_DB: ${POSTGRES_DB:-congress_trader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-congress}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Points at the external NUC PostgreSQL server (see .env)
      DATABASE_URL: ${DATABASE_URL}
      REPORTS_DIR: /reports
      DOCS_DIR: /docs
    ports:
      - "8000:8000"
    volumes:
      # Read-only mounts so the API can list/serve generated reports and project docs
      - ./reports:/reports:ro
      - ./docs:/docs:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
