services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-congress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-congress}
      POSTGRES_DB: ${POSTGRES_DB:-congress_trader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-congress}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Points at the external NUC PostgreSQL server (see .env)
      DATABASE_URL: ${DATABASE_URL}
      REPORTS_DIR: /reports
      DOCS_DIR: /docs
      # Cloudflare Access — per-user portfolio scoping (see backend/app/auth.py)
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      CF_ACCESS_DEV_USER: ${CF_ACCESS_DEV_USER:-}
    volumes:
      # Read-only mounts so the API can list/serve generated reports and project docs
      - ./reports:/reports:ro
      - ./docs:/docs:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Empty by default → Dockerfile falls back to a build-time
        # timestamp so cache busters are unique per build. scripts/deploy.sh
        # exports GIT_HASH=<git short-hash> so same-commit redeploys
        # reuse the same URL (intended cache reuse).
        GIT_HASH: ${GIT_HASH:-}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Sibling-repo bind-mounts. Each external repo lives next to
      # congress_trader/ and is served read-only under its own subpath.
      # No rebuild needed when the sibling repo changes — just
      # `docker compose restart frontend` (or nothing, since nginx reads
      # files on each request). Cache busting is the sibling repo's
      # responsibility — nginx's `no-cache` on *.css/*.js still applies.
      - ../goose_snake:/usr/share/nginx/html/games/gooooose:ro
    depends_on:
      - backend

volumes:
  postgres_data:
