log_format cf_real '$http_cf_connecting_ip - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log cf_real;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # JS/CSS — must revalidate every load. The entry-point HTML pins
    # `?v=<hash>` onto each <script>/<link>, but ES module SUB-IMPORTS
    # (e.g. ui.js → scene/mount.js → scene/battle-scene.js) have no
    # query string, so once cached `immutable` would freeze them
    # forever. `no-cache` forces the browser to ask the server on
    # every load; nginx's automatic ETag short-circuits unchanged
    # files to a cheap 304.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML entry points — never cache so deploys are always picked up
    location /trader {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /splash-admin {
        add_header Cache-Control "no-cache";
        try_files /splash-admin.html =404;
    }

    location = /docs {
        add_header Cache-Control "no-cache";
        try_files /docs.html =404;
    }

    # /games is a gated subtree (Cloudflare Access policy lives at the
    # CF dashboard level — see CLAUDE.md "Public deployment"). Match
    # /games (the current word-search landing) and explicit subpaths
    # for each game. Each game adds one location block + one COPY in
    # the frontend Dockerfile.
    location = /games {
        add_header Cache-Control "no-cache";
        try_files /games.html =404;
    }
    location = /games/bsg-trail {
        add_header Cache-Control "no-cache";
        try_files /bsg-trail.html =404;
    }
    location = /games/pond-puzzles {
        add_header Cache-Control "no-cache";
        try_files /pond-puzzles.html =404;
    }
    location = /games/crosswords {
        add_header Cache-Control "no-cache";
        try_files /crosswords.html =404;
    }
    # /games/gooooose — sibling repo bind-mounted at /games/gooooose/
    # via docker-compose. Redirect bare path to trailing slash so the
    # sibling repo's relative asset paths resolve under its own subtree.
    location = /games/gooooose {
        return 301 /games/gooooose/;
    }
    location = /games/gooooose/ {
        add_header Cache-Control "no-cache";
        try_files /games/gooooose/index.html =404;
    }
    # Catch-all under /games/* so static assets nested inside (sprites,
    # data files, etc.) resolve by URI.
    location /games/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /honks {
        add_header Cache-Control "no-cache";
        try_files /honks.html =404;
    }

    location = /friends {
        add_header Cache-Control "no-cache";
        try_files /friends.html =404;
    }

    # /spacex — public civic-action module. Must be exempted from
    # Cloudflare Access at the CF Zero Trust dashboard (Bypass policy
    # on path /spacex/*) for the auto-mailer to reach the public.
    location = /spacex {
        add_header Cache-Control "no-cache";
        try_files /spacex.html =404;
    }
    location = /spacex/mailer {
        add_header Cache-Control "no-cache";
        try_files /spacex-mailer.html =404;
    }
    location = /spacex/accountability {
        add_header Cache-Control "no-cache";
        try_files /spacex-accountability.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    # Other static assets (images, fonts, etc.)
    location / {
        try_files $uri =404;
    }
}
