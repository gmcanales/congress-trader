server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Trader app at /trader and /trader/* (SPA fallback to index.html)
    location /trader {
        try_files $uri /index.html;
    }

    # Splash picker dev tool
    location = /splash-admin {
        try_files /splash-admin.html =404;
    }

    # Landing page at root
    location = / {
        try_files /landing.html =404;
    }

    # Static assets (css, js, img, etc.)
    location / {
        try_files $uri =404;
    }
}
