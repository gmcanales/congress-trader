server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Versioned JS/CSS — cache forever (URL changes on every deploy)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML entry points — never cache so deploys are always picked up
    location /trader {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /splash-admin {
        add_header Cache-Control "no-cache";
        try_files /splash-admin.html =404;
    }

    location = /docs {
        add_header Cache-Control "no-cache";
        try_files /docs.html =404;
    }

    location = /honks {
        add_header Cache-Control "no-cache";
        try_files /honks.html =404;
    }

    location = /friends {
        add_header Cache-Control "no-cache";
        try_files /friends.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    # Other static assets (images, fonts, etc.)
    location / {
        try_files $uri =404;
    }
}
