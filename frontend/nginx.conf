log_format cf_real '$http_cf_connecting_ip - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

# Throttle the public (unauthenticated) API. /api/* is shielded by Cloudflare
# Access, but /public_api/* is open, so it needs its own abuse limits.
#
# (1) Per-IP caps, split by method (keyed on the real client IP —
#     CF-Connecting-IP, since traffic arrives via Cloudflare). Reads are cheap
#     and happen on every game-over, so GET is generous; writes are the thing
#     worth limiting, so POST is strict. Each map yields an empty key for the
#     OTHER method, and limit_req ignores empty keys — so each zone counts only
#     its own method.
map $request_method $pub_get_ip  { GET  $http_cf_connecting_ip; default ""; }
map $request_method $pub_post_ip { POST $http_cf_connecting_ip; default ""; }
limit_req_zone $pub_get_ip  zone=public_get:10m  rate=30r/m;   # reads:  ~1 / 2s
limit_req_zone $pub_post_ip zone=public_post:10m rate=6r/m;    # writes: strict
#
# (2) A *global* budget across ALL clients (both methods), so the NUC's total
#     work on /public_api/ stays bounded even under a distributed flood (many
#     IPs each under the per-IP caps). A constant key = one shared bucket.
#     public_api_all  → aggregate request rate (excess is queued, see location)
#     public_api_conn → ceiling on simultaneous in-flight requests
map $request_method $public_api_key { default "pub"; }   # constant, always non-empty
limit_req_zone  $public_api_key zone=public_api_all:1m  rate=5r/s;
limit_conn_zone $public_api_key zone=public_api_conn:1m;

server {
    listen 80;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log cf_real;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Public, unauthenticated API (NOT gated by Cloudflare Access, unlike
    # /api/*). Only routes deliberately mounted here are reachable without
    # auth. Throttled three ways: per-IP rate, a global rate budget (queues
    # excess), and a global concurrency ceiling — see the zones above and
    # docs/hardening.md for why a separate prefix beats a CF Access bypass.
    location /public_api/ {
        # Leaderboard payloads are tiny ({game,name,score}); cap the body so an
        # oversized POST is rejected (413) before it reaches the backend.
        client_max_body_size 2k;
        # Per-IP, split by method. GET (board fetch, once per game-over) is
        # generous; POST (score write) is strict. nodelay burst lets a normal
        # session through instantly, then the sustained per-IP rate applies.
        limit_req zone=public_get  burst=20 nodelay;
        limit_req zone=public_post burst=5  nodelay;
        # Global: the backend never sees more than ~5 req/s. Excess is QUEUED
        # (no nodelay → nginx delays it cheaply in its event loop) up to the
        # burst, then rejected. This is the total-throughput budget that
        # shields Postgres / the Python backend from a flood.
        limit_req zone=public_api_all  burst=40;
        # Hard ceiling on concurrent in-flight requests to the backend.
        limit_conn public_api_conn 12;
        # 429 (not the default 503) so clients see "Too Many Requests"; the
        # game degrades gracefully to its local-cache leaderboard on any error.
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://backend:8000/public_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # JS/CSS — must revalidate every load. The entry-point HTML pins
    # `?v=<hash>` onto each <script>/<link>, but ES module SUB-IMPORTS
    # (e.g. ui.js → scene/mount.js → scene/battle-scene.js) have no
    # query string, so once cached `immutable` would freeze them
    # forever. `no-cache` forces the browser to ask the server on
    # every load; nginx's automatic ETag short-circuits unchanged
    # files to a cheap 304.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML entry points — never cache so deploys are always picked up
    location /trader {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Root serves the app itself. (In the private deployment this served a
    # landing page that linked out to several unrelated modules; here the
    # trader IS the site.)
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Other static assets (images, fonts, etc.)
    location / {
        try_files $uri =404;
    }
}
